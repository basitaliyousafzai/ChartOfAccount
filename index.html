<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apex ERP — Autonomous COA &amp; General Ledger Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">Apex ERP — Autonomous COA &amp; General Ledger Engine</span>
    </div>
    <div class="app-bar-right">
      <span id="user-chip" class="user-chip" hidden>
        <span class="user-chip-avatar" aria-hidden="true">?</span>
        <span class="user-chip-text">Not signed in</span>
      </span>
      <button id="btn-logout" class="btn btn-ghost btn-sm" type="button" hidden>Log out</button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav-rail" aria-label="Primary navigation">
      <p class="nav-rail-title">Workspace</p>
      <button class="nav-btn" type="button" data-route="dashboard">Dashboard</button>
      <button class="nav-btn" type="button" data-route="coa">Chart of Accounts</button>
      <button class="nav-btn" type="button" data-route="wizard">Discovery Wizard</button>

      <p class="nav-rail-title">Transactions</p>
      <button class="nav-btn" type="button" data-route="journal">Journal Vouchers</button>
      <button class="nav-btn" type="button" data-route="pos-sale">POS Sale</button>
      <button class="nav-btn" type="button" data-route="sales-invoice">Sales Invoice</button>
      <button class="nav-btn" type="button" data-route="credit-note">Credit Note</button>
      <button class="nav-btn" type="button" data-route="purchase-bill">Purchase Bill</button>
      <button class="nav-btn" type="button" data-route="debit-note">Debit Note</button>
      <button class="nav-btn" type="button" data-route="receipts">Receipts</button>
      <button class="nav-btn" type="button" data-route="payments">Payments</button>
      <button class="nav-btn" type="button" data-route="expenses">Expenses</button>
      <button class="nav-btn" type="button" data-route="payroll">Payroll</button>
      <button class="nav-btn" type="button" data-route="inventory">Inventory</button>
      <button class="nav-btn" type="button" data-route="fixed-assets">Fixed Assets</button>
      <button class="nav-btn" type="button" data-route="forex">Forex Settlement</button>

      <p class="nav-rail-title">Reports &amp; Period</p>
      <button class="nav-btn" type="button" data-route="trial-balance">Trial Balance</button>
      <button class="nav-btn" type="button" data-route="income-statement">Income Statement</button>
      <button class="nav-btn" type="button" data-route="balance-sheet">Balance Sheet</button>
      <button class="nav-btn" type="button" data-route="ledger-card">Ledger Card</button>
      <button class="nav-btn" type="button" data-route="closing">Closing &amp; Backup</button>

      <div class="nav-rail-foot">
        <p class="nav-hint">Offline desktop shell · integer-cents ledger</p>
      </div>
    </nav>

    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
